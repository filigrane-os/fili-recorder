[package]
name = "fili-recorder"
version = "0.4.0"
edition = "2024"
description = "Cassette (fili-recorder): records the sound of the machine (an input and an output) and plays the recordings back, in a Qt Quick window like Casier"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
fili-ui = { git = "https://github.com/filigrane-os/fili-ui", tag = "v0.7.1" }
env_logger = { version = "0.11", default-features = false }
libc = "0.2.191"
log = "0.4"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# `make dev`: no link-time optimisation, several code generation units and incremental compilation, so that a change of the
# application rebuilds in a fraction of the release time
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
debug = 0

[build-dependencies]
cxx-qt-build = "0.10.0"
